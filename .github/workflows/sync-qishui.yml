name: Sync QiShuiMusic Script

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点定时同步
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch and Filter Config
        run: |
          # 1. 下载墨鱼原版规则
          curl -sSL "https://raw.githubusercontent.com/ddgksf2013/Rewrite/refs/heads/master/AdBlock/QiShuiMusicAds.conf" -o raw.conf

          # 2. 写入自定义配置头 (包揽 QUIC 禁用与开屏拦截)
          cat << 'EOF' > qishui.conf
          # ==========================================
          # 汽水音乐净化配置 (自动同步墨鱼 + 兼容福利中心领会员)
          # ==========================================

          hostname = webcast-open.douyin.com, beta-luna.douyin.com, api.qishui.com, api5-lq.qishui.com, tnc*-*.zijieapi.com

          # > 01. 强制禁用 QUIC/HTTP3 & HTTP-DNS (彻底封堵开屏穿透)
          ^https:\/\/tnc\d-(bjlgy|ali[a-z]{2})\d?\.zijieapi\.com\/get_domains\/v\d\/\? url jsonjq-response-body '.data.opaque_data_enabled = 0 | .data.ttnet_http_dns_enabled = 0 | .data.ttnet_quic_enabled = 0 | .data.ttnet_tt_http_dns = 0 | .data.ttnet_dispatch_actions |= map(select(.action != "dispatch" and .action != "tc"))'

          # > 02. 精准开屏与直播弹窗拦截
          ^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/splash url reject-200
          ^https:\/\/webcast-open\.douyin\.com\/webcast\/openapi\/feed\/\? url reject-200

          EOF

          # 3. 使用 grep -v -E 硬核反向过滤（绝无死角剔除所有冲突关键字和包含它们的整行及注释）
          grep -v -E "hostname|get_domains|media_ads|/luna/ads|/luna/commerce|视频广告|通用广告|广告弹窗|DNS处理" raw.conf >> qishui.conf || true

          # 4. 追加原生视频流净化尾部
          cat << 'EOF' >> qishui.conf

          # > 03. 播放页面视频流净化 (原生 JSONJQ)
          ^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/me\/recently-played-media\? url jsonjq-response-body 'del(.media[] | select(.type == "video"))'
          EOF

          # 5. 删除临时文件
          rm raw.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add qishui.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Pure Shell Filter: Completely remove blocking rules" && git push)
