name: Sync QiShuiMusic Script

on:
  schedule:
    - cron: '0 0 * * *'  # 每天定时自动同步
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch and Clean QiShui Config via Regex
        run: |
          # 1. 拉取墨鱼原始规则
          curl -sSL "https://raw.githubusercontent.com/ddgksf2013/Rewrite/refs/heads/master/AdBlock/QiShuiMusicAds.conf" -o raw.conf

          # 2. 使用 Python 正则表达进行模糊穿透式清洗与合并
          python3 -c '
          import re

          with open("raw.conf", "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          # 移除旧 hostname 声明
          content = re.sub(r"hostname\s*=.*", "", content)

          # 强制剔除包含 media_ads, /ads, /commerce 的所有规则行（忽略前后的正则路径匹配符号）
          content = re.sub(r"^.*\/luna\/media_ads.*$\n?", "", content, flags=re.MULTILINE)
          content = re.sub(r"^.*\/luna\/ads.*$\n?", "", content, flags=re.MULTILINE)
          content = re.sub(r"^.*\/luna\/commerce.*$\n?", "", content, flags=re.MULTILINE)

          # 强制剔除墨鱼原版的 DNS 阻断行
          content = re.sub(r"^.*get_domains.*$\n?", "", content, flags=re.MULTILINE)

          header = """# ==========================================
          # 汽水音乐净化配置 (自动同步墨鱼 + 兼容福利中心领会员)
          # ==========================================

          hostname = webcast-open.douyin.com, beta-luna.douyin.com, api.qishui.com, api5-lq.qishui.com, tnc*-*.zijieapi.com

          # > 01. 强制禁用 QUIC/HTTP3 & HTTP-DNS (彻底封堵开屏穿透)
          ^https:\\/\\/tnc\\d-(bjlgy|ali[a-z]{2})\\d?\\.zijieapi\\.com\\/get_domains\\/v\\d\\/\\? url jsonjq-response-body \x27.data.opaque_data_enabled = 0 | .data.ttnet_http_dns_enabled = 0 | .data.ttnet_quic_enabled = 0 | .data.ttnet_tt_http_dns = 0 | .data.ttnet_dispatch_actions |= map(select(.action != "dispatch" and .action != "tc"))\x27

          # > 02. 精准开屏与直播弹窗拦截
          ^https:\\/\\/(beta-luna\\.douyin|api5-lq\\.qishui)\\.com\\/luna\\/splash url reject-200
          ^https:\\/\\/webcast-open\\.douyin\\.com\\/webcast\\/openapi\\/feed\\/\\? url reject-200
          """

          footer = """
          # > 03. 播放页面视频流净化 (原生 JSONJQ)
          ^https:\\/\\/(beta-luna\\.douyin|api5-lq\\.qishui)\\.com\\/luna\\/me\\/recently-played-media\\? url jsonjq-response-body \x27del(.media[] | select(.type == "video"))\x27
          """

          final_content = header + content + footer

          # 清理连续空行
          final_content = re.sub(r"\n\s*\n", "\n\n", final_content)

          with open("qishui.conf", "w", encoding="utf-8") as f:
              f.write(final_content)
          '
          rm raw.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add qishui.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Python Regex Clean: Force remove blocking rules" && git push)
