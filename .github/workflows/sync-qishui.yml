name: Sync QiShuiMusic Script

on:
  schedule:
    - cron: '0 0 * * *'  # 每天定时自动同步
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Patch QiShuiMusic Script
        run: |
          # 1. 从墨鱼 GitHub 仓库拉取最新原版规则
          curl -sSL "https://raw.githubusercontent.com/ddgksf2013/Rewrite/refs/heads/master/AdBlock/QiShuiMusicAds.conf" -o qishui.conf

          # 2. 补全包含穿山甲 SDK 与字节广告在内的全部开屏域名
          sed -i 's/hostname = .*/hostname = webcast-open.douyin.com, beta-luna.douyin.com, api.qishui.com, api5-lq.qishui.com, tnc*-*.zijieapi.com, *.pangle.io, *-*pangle*.com, SF3-ttcdn-tos.pstatp.com, api-access.pangle.io, log-api.pangle.io/' qishui.conf

          # 3. 剔除拦截看广告领会员的两条冲突规则
          sed -i '/\/luna\/media_ads/d' qishui.conf
          sed -i '/\/luna\/ads/d' qishui.conf

          # 4. 在文件顶部追加 QUIC 禁用逻辑（防止字节系 APP 绕过 Qx 解密）
          EX_QUIC="^https:\/\/tnc\\\d-(bjlgy|ali[a-z]{2})\\\d?\.zijieapi\.com\/get_domains\/v\\\d\/\? url jsonjq-response-body '.data.opaque_data_enabled = 0 | .data.ttnet_http_dns_enabled = 0 | .data.ttnet_quic_enabled = 0 | .data.ttnet_tt_http_dns = 0 | .data.ttnet_dispatch_actions |= map(select(.action != \"dispatch\" and .action != \"tc\"))'"
          sed -i "/hostname =/a \\# > 禁用 QUIC/HTTP3 (防止开屏穿透)\n$EX_QUIC" qishui.conf

          # 5. 补全穿山甲 (Pangle) 开屏广告域名拦截与播放页 JS
          echo -e "\n# > 彻底拦截穿山甲 SDK 开屏广告预加载\n^https?:\/\/(api-access|log-api)\.pangle\.io url reject-200" >> qishui.conf
          echo -e "^https?:\/\/.*-pangle.*\.com url reject-200" >> qishui.conf
          echo -e "^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/me\/recently-played-media\? url script-response-body https://kelee.one/Resource/JavaScript/SodaMusic/SodaMusic_remove_ads.js" >> qishui.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add qishui.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Enhance Pangle ad blocking for QiShuiMusic" && git push)
