name: Sync QiShuiMusic Script

on:
  schedule:
    - cron: '0 0 * * *'  # 每天定时自动同步
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch and Clean QiShui Config
        run: |
          # 1. 拉取墨鱼原始规则
          curl -sSL "https://raw.githubusercontent.com/ddgksf2013/Rewrite/refs/heads/master/AdBlock/QiShuiMusicAds.conf" -o raw.conf

          # 2. 写入自定义标头
          cat << 'EOF' > qishui.conf
          # ==========================================
          # 汽水音乐净化配置 (自动同步墨鱼 + 兼容福利中心领会员)
          # ==========================================

          hostname = webcast-open.douyin.com, beta-luna.douyin.com, api.qishui.com, api5-lq.qishui.com, tnc*-*.zijieapi.com

          # > 01. 强制禁用 QUIC/HTTP3 & HTTP-DNS (彻底封堵开屏穿透)
          ^https:\/\/tnc\d-(bjlgy|ali[a-z]{2})\d?\.zijieapi\.com\/get_domains\/v\d\/\? url jsonjq-response-body '.data.opaque_data_enabled = 0 | .data.ttnet_http_dns_enabled = 0 | .data.ttnet_quic_enabled = 0 | .data.ttnet_tt_http_dns = 0 | .data.ttnet_dispatch_actions |= map(select(.action != "dispatch" and .action != "tc"))'

          # > 02. 精准开屏与直播弹窗拦截
          ^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/splash url reject-200
          ^https:\/\/webcast-open\.douyin\.com\/webcast\/openapi\/feed\/\? url reject-200

          EOF

          # 3. 使用 sed 强力删除（以 # 作为分隔符，彻底解决 / 路径转义失效问题）
          sed -i '#hostname#d' raw.conf
          sed -i '#get_domains#d' raw.conf
          sed -i '#DNS处理#d' raw.conf
          sed -i '#media_ads#d' raw.conf
          sed -i '#视频广告#d' raw.conf
          sed -i '#/luna/ads#d' raw.conf
          sed -i '#通用广告#d' raw.conf
          sed -i '#/luna/commerce#d' raw.conf
          sed -i '#广告弹窗#d' raw.conf

          # 4. 追加清洗后的规则内容
          cat raw.conf >> qishui.conf

          # 5. 追加自定义尾部
          cat << 'EOF' >> qishui.conf

          # > 03. 播放页面视频流净化 (原生 JSONJQ)
          ^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/me\/recently-played-media\? url jsonjq-response-body 'del(.media[] | select(.type == "video"))'
          EOF

          # 6. 清理临时文件
          rm raw.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add qishui.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fix sed delimiter syntax for QiShui config" && git push)
