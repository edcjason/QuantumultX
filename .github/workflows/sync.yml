name: Sync Remote Config

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Remote Config & Append Policy
        run: |
          # 1. 下载墨鱼配置到临时文件
          curl -sSL "http://ddgksf2013.top/Profile/QuantumultX.conf" -o raw.conf
          
          # 2. 写入塔台所需的策略组和基础声明
          cat << 'EOF' > mygz.conf
          [general]
          profile_img_url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/QuantumultX.png

          [policy]
          static=节点选择, direct, proxy, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
          static=延迟自动, url-latency-benchmark, check-interval=600, tolerance=100

          EOF

          # 3. 追加墨鱼原始规则内容
          cat raw.conf >> mygz.conf
          rm raw.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mygz.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto sync and patch policy for Tower" && git push)
