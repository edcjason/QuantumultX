name: Sync Remote Config

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Convert Rules
        run: |
          # 1. 带上 Quantumult X 的 User-Agent 头，绕过 ddgksf2013.top 的防盗链/403限制
          curl -sSL -f -H "User-Agent: Quantumult%20X/1.0.30" "http://ddgksf2013.top/Profile/QuantumultX.conf" -o raw.conf || \
          curl -sSL -f "https://cdn.jsdelivr.net/gh/ddgksf2013/Profile/QuantumultX.conf" -o raw.conf

          # 2. 写入塔台必需的 Surge 基础策略组标头
          cat << 'EOF' > mygz.conf
          [General]
          loglevel = notify
          dns-server = system, 119.29.29.29, 223.5.5.5

          [Proxy]
          DIRECT = direct
          REJECT = reject

          [Proxy Group]
          节点选择 = select, DIRECT
          自动选择 = url-test, DIRECT, interval=600, tolerance=100
          国外媒体 = select, 节点选择, DIRECT
          国内媒体 = select, DIRECT, 节点选择
          微软服务 = select, DIRECT, 节点选择
          苹果服务 = select, DIRECT, 节点选择
          Telegram = select, 节点选择, DIRECT
          Final = select, 节点选择, DIRECT

          EOF

          # 3. 将 QuantumultX 转换并追加至配置末尾
          sed -E \
            -e 's/^HOST,(.*)/DOMAIN,\1/' \
            -e 's/^HOST-SUFFIX,(.*)/DOMAIN-SUFFIX,\1/' \
            -e 's/^HOST-KEYWORD,(.*)/DOMAIN-KEYWORD,\1/' \
            -e 's/,[ ]*([A-Za-z0-9_-]+)$/, \1/' \
            raw.conf >> mygz.conf

          rm raw.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mygz.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fix UA for ddgksf2013.top" && git push)
