name: Sync Remote Config

on:
  schedule:
    - cron: '0 0 * * *'  # 每天定时自动同步
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Pure QuantumultX Config
        run: |
          # 伪装 QX 的 User-Agent 绕过 ddgksf2013.top 的防盗链限制，直接抓取原汁原味的配置文件
          curl -sSL -f -H "User-Agent: Quantumult%20X/1.0.30" "http://ddgksf2013.top/Profile/QuantumultX.conf" -o mygz.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mygz.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync original QuantumultX config" && git push)
