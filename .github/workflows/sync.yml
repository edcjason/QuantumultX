name: Sync Remote Config

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Convert Real Config
        run: |
          # 1. 使用 subconverter 将墨鱼 GitHub 仓库真正的 Q-X 纯文本配置转换为 Surge 格式
          curl -sSL "https://api.v1.mk/sub?target=surge&url=https%3A%2F%2Fraw.githubusercontent.com%2Fddgksf2013%2FFilter%2Fmaster%2FQuantumultX.conf&ver=4" -o raw.conf

          # 2. 写入标准的 Surge 头部声明，确保塔台 100% 能通过策略组校验
          cat << 'EOF' > mygz.conf
          [General]
          loglevel = notify
          dns-server = system, 119.29.29.29, 223.5.5.5

          [Proxy]
          DIRECT = direct
          REJECT = reject

          [Proxy Group]
          节点选择 = select, DIRECT
          自动选择 = url-test, DIRECT, interval=600, tolerance=100
          国外媒体 = select, 节点选择, DIRECT
          国内媒体 = select, DIRECT, 节点选择
          微软服务 = select, DIRECT, 节点选择
          苹果服务 = select, DIRECT, 节点选择
          Telegram = select, 节点选择, DIRECT
          Final = select, 节点选择, DIRECT

          EOF

          # 3. 追加转换后的真正分流/重写规则
          cat raw.conf >> mygz.conf
          rm raw.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mygz.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Fix raw URL and sync Surge config" && git push)
