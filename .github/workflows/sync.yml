name: Sync Remote Config

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Raw Rules and Convert locally
        run: |
          # 1. 直接拉取墨鱼真正的原生配置文件 (Raw)
          curl -sSL "https://raw.githubusercontent.com/ddgksf2013/Filter/master/QuantumultX.conf" -o raw.conf

          # 2. 写入塔台必需的 Surge 基础策略组标头
          cat << 'EOF' > mygz.conf
          [General]
          loglevel = notify
          dns-server = system, 119.29.29.29, 223.5.5.5

          [Proxy]
          DIRECT = direct
          REJECT = reject

          [Proxy Group]
          节点选择 = select, DIRECT
          自动选择 = url-test, DIRECT, interval=600, tolerance=100
          国外媒体 = select, 节点选择, DIRECT
          国内媒体 = select, DIRECT, 节点选择
          微软服务 = select, DIRECT, 节点选择
          苹果服务 = select, DIRECT, 节点选择
          Telegram = select, 节点选择, DIRECT
          Final = select, 节点选择, DIRECT

          EOF

          # 3. 本地清理并转换规则格式（将 QuantumultX 关键字转为 Surge 格式）
          sed -E \
            -e 's/^HOST,(.*)/DOMAIN,\1/' \
            -e 's/^HOST-SUFFIX,(.*)/DOMAIN-SUFFIX,\1/' \
            -e 's/^HOST-KEYWORD,(.*)/DOMAIN-KEYWORD,\1/' \
            -e 's/,[ ]*([A-Za-z0-9_-]+)$/, \1/' \
            raw.conf >> mygz.conf

          rm raw.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mygz.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Local regex conversion without third party API" && git push)
