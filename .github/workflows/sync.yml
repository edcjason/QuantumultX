name: Sync Remote Config

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Remote Config
        run: |
          curl -sSL "http://ddgksf2013.top/Profile/QuantumultX.conf" -o mygz.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mygz.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto sync from ddgksf2013" && git push)
