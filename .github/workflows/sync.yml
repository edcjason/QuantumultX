name: Sync Remote Config

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & Convert to Surge Format
        run: |
          # 使用 subconverter 将墨鱼 Q-X 配置转换为塔台支持的 Surge 格式
          curl -sSL "https://api.v1.mk/sub?target=surge&url=http%3A%2F%2Fddgksf2013.top%2FProfile%2FQuantumultX.conf&ver=4" -o mygz.conf

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add mygz.conf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Convert Q-X config to Surge format for Tower" && git push)
