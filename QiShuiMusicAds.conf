// ==UserScript==
// @ScriptName        汽水音乐净化[视界切片版]
// @Author            @edcwork
// @Function          移除汽水音乐广告、视频流、激励横幅及开屏/弹窗推广
// @UpdateTime        2026-08-23
// @Suitable          Quantumult X (重写引用)
// @Attention         使用前请确保 QX MitM 已开启并正确信任证书
// @Version           V1.0.0
// @ScriptURL         https://raw.githubusercontent.com/edcjason/QuantumultX/main/SodaMusic.conf
// ==/UserScript==

hostname = webcast-open.douyin.com, beta-luna.douyin.com, api.qishui.com, api5-lq.qishui.com, tnc*-*.zijieapi.com

# > 01 拦截商业化增值配置@视界切片
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/commerce\/upsells_config\? url reject-dict

# > 02 拦截通用广告API@视界切片
^https:\/\/(api|api5-lq)\.qishui\.com\/luna\/ads\/ url reject-dict
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/ads\/ url reject-dict

# > 03 拦截直播/Feed流广告@视界切片
^https:\/\/webcast-open\.douyin\.com\/webcast\/openapi\/feed\/\? url reject-dict

# > 04 拦截宝箱/活动入口配置@视界切片
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/treasure\/entrance\/config\? url reject-dict
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/activities\? url reject-dict

# > 05 拦截媒体广告及商业营销@视界切片
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/media_ads\? url reject-dict
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/commerce\/upsells\? url reject-dict
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/commerce\/v2\/commerce_info\? url reject-dict

# > 06 拦截听歌看视频提醒@视界切片
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/listen-video\/reminder\? url reject-dict

# > 07 DNS与网络调度处理@视界切片
^https:\/\/tnc\d-(bjlgy|ali[a-z]{2})\d?\.zijieapi\.com\/get_domains\/v\d\/\? url script-response-body https://raw.githubusercontent.com/你的用户名/你的仓库名/main/SodaMusic.js

# > 08 页面JSON响应体净化(我的/卡片/SongTab/更多面板/播放记录)@视界切片
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/(me|feed\/song-tab|card|more-panel|me\/recently-played-media)\? url script-response-body https://raw.githubusercontent.com/你的用户名/你的仓库名/main/SodaMusic.js
