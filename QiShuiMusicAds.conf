// ==UserScript==
// @ScriptName        汽水音乐精细化净化[开屏拦截+可看广告领VIP]
// @Author            @edcjason
// @Function          精细化拦截开屏广告，同时保留看广告领 VIP 激励视频功能
// @UpdateTime        2026-09-08
// @Suitable          Quantumult X
// ==/UserScript==

hostname = beta-luna.douyin.com, api.qishui.com, api5-lq.qishui.com

# > 01 精准拦截开屏广告 (Splash Screen Ads)
^https:\/\/(beta-luna\.douyin|api|api5-lq\.qishui)\.com\/luna\/ads\/splash url reject-dict
^https:\/\/(beta-luna\.douyin|api|api5-lq\.qishui)\.com\/luna\/ads\/launch url reject-dict

# > 02 屏蔽界面牛皮癣/弹窗 (不影响视频广告领取)
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/treasure\/entrance\/config\? url reject-dict

# > 03 页面 JSON 响应体净化 (剔除“我的”页面横幅、去除推荐杂项)
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/(me|feed\/song-tab|card|more-panel|me\/recently-played-media)\? url script-response-body https://raw.githubusercontent.com/edcjason/QuantumultX/main/QiShuiMusicAds.js

# > 04 拦截宝箱/活动入口配置
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/treasure\/entrance\/config\? url reject-dict
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/activities\? url reject-dict

# > 05 拦截媒体广告及商业营销
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/media_ads\? url reject-dict
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/commerce\/upsells\? url reject-dict
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/commerce\/v2\/commerce_info\? url reject-dict

# > 06 拦截听歌看视频提醒
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/listen-video\/reminder\? url reject-dict

# > 07 DNS与网络调度处理
^https:\/\/tnc\d-(bjlgy|ali[a-z]{2})\d?\.zijieapi\.com\/get_domains\/v\d\/\? url script-response-body https://raw.githubusercontent.com/edcjason/QuantumultX/main/QiShuiMusicAds.js

# > 08 页面及媒体JSON响应体净化(增加 media_v2 与 VIP 数据篡改)
^https:\/\/(beta-luna\.douyin|api5-lq\.qishui)\.com\/luna\/(media_v2|me|feed\/song-tab|card|more-panel|me\/recently-played-media)\? url script-response-body https://raw.githubusercontent.com/edcjason/QuantumultX/main/QiShuiMusicAds.js
